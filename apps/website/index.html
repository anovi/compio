<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Try Compio calculations directly in the browser." />
    <title>Compio embedded editor examples</title>
  </head>
  <body>
    <main>
      <header class="intro">
        <p class="eyebrow">Compio</p>
        <h1>Write calculations like notes</h1>
        <p>Edit either example to see arithmetic, units, variables, and currency conversions update immediately.</p>
      </header>

      <section class="examples" aria-label="Interactive calculator examples">
        <article class="example">
          <div class="example__copy">
            <h2>Everyday arithmetic</h2>
            <p>Mix regular calculations with compatible units.</p>
          </div>
          <div id="arithmetic-editor" class="editor-frame" aria-label="Arithmetic and units editor"></div>
        </article>

        <article class="example">
          <div class="example__copy">
            <h2>Variables and currencies</h2>
            <p>Name values once, reuse them, and convert the result.</p>
          </div>
          <div id="currency-editor" class="editor-frame" aria-label="Variables and currencies editor"></div>
        </article>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
